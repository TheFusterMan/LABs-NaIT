<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Ассортимент зоомагазина</title>
	<script src="JavaScript/data.js"></script>
	<script src="JavaScript/filter.js"></script>
	<script src="JavaScript/sort.js"></script>
	<script src="JavaScript/table.js"></script>
	<script src="JavaScript/main.js"></script>
</head>
<body>
<p>
	<a href="index.html">Самые популярные животные</a><br>
	<b><big><a href="list.html">Каталог животных</a></big></b>
</p>
<hr>
<details>
	<summary>График</summary>
	<form>
		<p><b>Значение по оси OX</b></p>
		<p>
			<label><input type="radio" name="axis_x"> Категория</label><br>
			<label><input type="radio" name="axis_x"> Порода</label>
		</p>
		<p><b>Результат</b></p>
		<p>
			<label><input type="checkbox"> Средняя цена</label><br>
			<label><input type="checkbox"> Максимальная цена</label><br>
			<label><input type="checkbox"> Среднее количество</label><br>
			<label><input type="checkbox"> Общее количество</label>
		</p>
		<input type="button" value="Построить">
	</form>
	<p>Здесь будет график</p>
</details>

<details>
	<summary>Фильтр</summary>
	<form id="filterForm">
		<p>
			<label for="animal_name">Название животного: </label><input type="text" id="animal_name">
		</p>
		<p>
			<label for="category">Категория: </label><input type="text" id="category">
		</p>
		<p>
			<label for="breed">Порода: </label><input type="text" id="breed">
		</p>
		<p>
			<label>Количество: от <input type="text" id="qty_from" size="8"></label>
			<label>до <input type="text" id="qty_to" size="8"></label>
		</p>
		<p>
			<label>Цена, руб: от <input type="text" id="price_from" size="8"></label>
			<label>до <input type="text" id="price_to" size="8"></label>
		</p>
		<input type="button" id="findBtn" value="Найти">
		<input type="button" id="resetFilterBtn" value="Сбросить">
	</form>
</details>

<details>
	<summary>Сортировка</summary>
	<form>
		<p>
			<label>
				Первый уровень:
				<select id="sort1">
					<option value="none">Нет</option>
					<option value="name">Название животного</option>
					<option value="cat">Категория</option>
					<option value="breed">Порода</option>
					<option value="qty">Количество</option>
					<option value="price">Цена, руб.</option>
				</select>
			</label>
			<label>
				по убыванию? <input type="checkbox" id="sort1_desc">
			</label>
		</p>
		<p>
			<label>
				Второй уровень:
				<select id="sort2">
					<option value="none">Нет</option>
					<option value="name">Название животного</option>
					<option value="cat">Категория</option>
					<option value="breed">Порода</option>
					<option value="qty">Количество</option>
					<option value="price">Цена, руб.</option>
				</select>
			</label>
			<label>
				по убыванию? <input type="checkbox" id="sort2_desc">
			</label>
		</p>
		<p>
			<label>
				Третий уровень:
				<select id="sort3">
					<option value="none">Нет</option>
					<option value="name">Название животного</option>
					<option value="cat">Категория</option>
					<option value="breed">Порода</option>
					<option value="qty">Количество</option>
					<option value="price">Цена, руб.</option>
				</select>
			</label>
			<label>
				по убыванию? <input type="checkbox" id="sort3_desc">
			</label>
		</p>
		<input type="button" id="sortBtn" value="Сортировать">
		<input type="button" id="resetSortBtn" value="Сбросить сортировку">
	</form>
</details>
<table border="1" cellspacing="0" cellpadding="5">
	<thead align="center">
	<tr>
		<th>Название животного</th>
		<th>Категория</th>
		<th>Порода</th>
		<th>Количество</th>
		<th>Цена, руб.</th>
		<th>Наличие</th>
	</tr>
	</thead>
	<tbody valign="top" id="tableBody"></tbody>
</table>
</body>
</html>
