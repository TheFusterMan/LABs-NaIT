<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Трансформация и анимация</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="Resources/d3.v7.min.js"> </script>
    <script src="JavaScript/main.js"></script>
    <script src="JavaScript/image.js"></script>
</head>
<body>
    <form id="setting">
        <p>Координаты рисунка<br>
            <label for="cx">x: </label>
            <input type="number" id="cx" value="100" max="600" min="0"><br>
            <label for="cy">y: </label>
            <input type="number" id="cy" value="100" max="600" min="0">
        </p>

        <p>Масштаб<br>
            <label for="sx">по x: </label>
            <input type="number" id="sx" value="2" max="600" min="0"><br>
            <label for="sy">по y: </label>
            <input type="number" id="sy" value="2" max="600" min="0">
        </p>

        <p>Поворот<br>
            <label for="ang">угол: </label>
            <input type="number" id="ang" value="180" max="360" min="0"><br>
        </p>

        <p>
            <input type="button" value="Нарисовать">
            <input type="button" value="Очистить">
        </p>
    </form>


    <svg></svg>

</body>
</html>
