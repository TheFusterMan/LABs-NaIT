<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<title>Title</title>
</head>
<body>
	<script>
		let n = prompt('Введите число:');
		
		if (isNaN(parseFloat(n)) || !isFinite(n)) {
			alert('Введенно не число!');
		} else {
			document.write( +n + 1 );
		}
	</script>
</body>
</html>
